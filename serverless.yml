service: express-ec2-deployment

provider:
  name: aws
  region: us-east-1

resources:
  Resources:
    MyEC2Instance:
      Type: AWS::EC2::Instance
      Properties:
        InstanceType: t2.micro
        ImageId: ami-0c55b159cbfafe1f0 # Update this based on your region (Ubuntu 22.04)
        KeyName: my-key-pair # Ensure this key exists in your AWS console
        SecurityGroups:
          - Ref: InstanceSecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            sudo apt-get update -y
            sudo apt-get install -y nodejs npm git
            # Clone and start your Express app here
            git clone https://github.com/your-repo/express-app.git
            cd express-app
            npm install
            npm start

    InstanceSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Enable HTTP and SSH access
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 3000 # Your Express Port
            ToPort: 3000
            CidrIp: 0.0.0.0/0